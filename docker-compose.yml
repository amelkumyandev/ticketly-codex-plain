services:
  api:
    build:
      context: .
      dockerfile: src/Ticketly.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ticketly;Username=ticketly;Password=ticketly
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ticketly
      POSTGRES_USER: ticketly
      POSTGRES_PASSWORD: ticketly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

